name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-dotenv

      - name: Check Python syntax
        run: |
          python -m py_compile app/__init__.py
          python -m py_compile flask_app.py
          python -m py_compile config.py

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: mechanic_shop_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-dotenv

      - name: Wait for MySQL
        run: |
          sleep 10

      - name: Set up test environment
        env:
          DATABASE_URI: mysql+mysqlconnector://root:testpassword@127.0.0.1:3306/mechanic_shop_test
          SECRET_KEY: test-secret-key-for-ci
          FLASK_ENV: testing
        run: |
          export DATABASE_URI=$DATABASE_URI
          export SECRET_KEY=$SECRET_KEY

      - name: Run unit tests
        env:
          DATABASE_URI: mysql+mysqlconnector://root:testpassword@127.0.0.1:3306/mechanic_shop_test
          TEST_DATABASE_URI: mysql+mysqlconnector://root:testpassword@127.0.0.1:3306/mechanic_shop_test
          SECRET_KEY: test-secret-key-for-ci
          FLASK_ENV: testing
        run: |
          python -m unittest discover tests -v

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.SERVICE_ID }}
        run: |
          curl -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Deployment notification
        run: echo "Deployment triggered successfully to Render"
